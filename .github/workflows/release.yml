name: 桌面客户端发布

# 触发方式: 手动 (workflow_dispatch)。
# 在 GitHub Actions 页面点 "Run workflow", 选择要构建的平台 + 版本号,
# 构建完成后自动创建/更新 Release 并上传安装包。
#
# 为什么不用 tag 自动触发:
#   - 多平台并行构建, mac/linux 未就绪时会自动失败污染 Release
#   - 手动触发可精确控制 "今天只发 Windows, 明天补 mac"
#   - 版本号通过 input 传入, 与 tag 解耦, 更灵活
#
# 注册提醒: GitHub 只注册「随某次 push 新增或修改过」的 workflow 文件。
# 本文件最初随「创建默认分支」那次 push 进入仓库, 而那次 GitHub 不注册任何
# workflow —— 于是它一直不在 Actions 列表里 (只有 workflow_dispatch 触发器,
# 没被注册就没法手动跑)。改动本文件即可补注册; 新增 workflow 文件同理。
#
# 使用:
#   gh workflow run release.yml -f version=v0.2.0 -f platforms=windows
#   或 GitHub 网页 Actions → 桌面客户端发布 → Run workflow
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 v0.1.33, 用作 Release tag 和标题; 必须与 frontend_v2/package.json 的 version 一致, 否则流水线直接失败)'
        required: true
        default: 'v0.3.37'
      platforms:
        description: '要构建的平台 (逗号分隔: windows,macos,linux)'
        required: true
        default: 'windows'
      prerelease:
        description: '是否为预发布 (勾选则标记为 Pre-release)'
        type: boolean
        default: false

permissions:
  contents: write   # 创建 Release 需要写权限

jobs:
  # 第一步: 过滤出本次要构建的平台
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
      ver: ${{ steps.filter.outputs.ver }}
    steps:
      - name: 检出代码
        # 仅为校验版本一致性 (读 frontend_v2/package.json), 浅检出足够
        uses: actions/checkout@v4

      - id: filter
        run: |
          # 版本号唯一权威 = frontend_v2/package.json (安装包、页面显示、更新检查同源)。
          # 发版输入与它不一致直接失败, 防止 tag/安装包/页面三处版本漂移。
          PKG_VER=$(python3 -c "import json; print(json.load(open('frontend_v2/package.json'))['version'])")
          REQ_VER='${{ github.event.inputs.version }}'
          if [ "v$PKG_VER" != "$REQ_VER" ]; then
            echo "::error::版本不一致: 发版输入 $REQ_VER, frontend_v2/package.json 为 v$PKG_VER。请以 frontend_v2/package.json 为准, 统一版本号后再发版。"
            exit 1
          fi

          REQUESTED="${{ github.event.inputs.platforms }}"
          # macOS 仅构建 ARM64 (Apple Silicon), 不构建 Intel:
          #   1) GitHub 最后一个原生 Intel runner (macos-13) 已于 2025-12-04 退役;
          #   2) 项目依赖 polars, 而 polars 自 1.33 起移除了 macOS x86_64 原生 wheel
          #      (改 py3-none-any), 在 arm64 runner 上经 Rosetta 无法产出可运行的 x64 包。
          #   runner 用 macos-26 (2026-02 GA, 免费, arm64 原生, SDK 更新)。
          ALL='[{"os":"windows-latest","artifact":"HQuant-Setup-x64.exe","platform":"windows"},{"os":"macos-26","artifact":"HQuant-macos-arm64.dmg","platform":"macos","arch":"arm64"},{"os":"ubuntu-latest","artifact":"HQuant-linux-x64.tar.gz","platform":"linux"}]'
          # 按 input 过滤平台 (macos → arm64 单项)
          python3 -c "
          import json, sys
          requested = '${{ github.event.inputs.platforms }}'.split(',')
          requested = [r.strip() for r in requested if r.strip()]
          ver = '${{ github.event.inputs.version }}'.lstrip('v')  # v0.3.3 → 0.3.3
          all_platforms = json.loads('''$ALL''')
          selected = [p for p in all_platforms if p['platform'] in requested]
          # 产物文件名带版本号 (HQuant-Setup-x64-0.3.3.exe): 用户下载后一眼可辨版本。
          # 按已知后缀插入版本号 — 不能用 rpartition('.') 拆扩展名:
          # "HQuant-linux-x64.tar.gz" 会拆成 stem=".tar" + ext="gz", 拼出
          # "HQuant-linux-x64.tar-0.3.9.gz", 与 latest.json 清单的通配格式不符。
          for p in selected:
              name = p['artifact']
              for suffix in ('.tar.gz', '.dmg', '.exe'):
                  if name.endswith(suffix):
                      p['artifact'] = f'{name[:-len(suffix)]}-{ver}{suffix}'
                      break
              else:
                  raise SystemExit(f'未知产物后缀: {name}')
          print('matrix=' + json.dumps({'include': selected}))
          with open('$GITHUB_OUTPUT', 'a') as f:
              f.write('matrix=' + json.dumps({'include': selected}) + '\n')
              f.write('ver=' + ver + '\n')
          "

  # 第二步: 各平台并行构建
  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # 单平台失败不影响其他平台
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # issue #513: 构建产物内的 VERSION / pyproject / _FALLBACK_VERSION 从
      # frontend_v2/package.json 派生, 防止发版只改 package.json 时版本漂移。
      - name: 同步版本号 (从 frontend_v2/package.json 派生)
        run: python3 scripts/sync_versions.py

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 设置 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend_v2/pnpm-lock.yaml

      - name: 构建前端
        working-directory: frontend_v2
        # 更新清单地址在构建期注入 (Vite 只认 import.meta.env.VITE_*):
        # 不注入的话 updateCheck.ts 里 MANIFEST_URL 为空 → 客户端「检查更新」永久停用。
        # 与下方 R2 上传步骤同源 (同一个 vars.HQUANT_UPDATE_BASE_URL), 避免两处漂移;
        # 变量未配置时拼出 "/latest.json", 前端会因非绝对 URL 判定为未配置而停用。
        env:
          VITE_UPDATE_MANIFEST_URL: ${{ format('{0}/latest.json', vars.HQUANT_UPDATE_BASE_URL) }}
          VITE_DOWNLOAD_PAGE_URL: ${{ vars.HQUANT_DOWNLOAD_PAGE_URL }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: 设置 Python
        run: uv python install 3.12

      - name: 安装后端依赖 (含 desktop + legacy-cpu, 不含 backtest)
        working-directory: backend
        # --no-dev 排除 pytest/ruff/mypy; --extra desktop 装 pywebview
        # --extra legacy-cpu 装 polars[rtcompat] 运行时兼容内核:
        #   让安装包同时兼容 AVX2 新 CPU 和无 AVX2 的老 CPU (NAS/老服务器/国产 CPU)。
        #   rtcompat 会在运行时自动探测 CPU 能力 —— 有 AVX2 用 AVX2, 没有则回退,
        #   对新 CPU 性能几乎无损 (Polars 1.x 官方推荐方案)。
        # 不加 --extra backtest, 主包不含 vectorbt/numba/llvmlite
        run: uv sync --no-dev --extra desktop --extra legacy-cpu

      - name: 安装 PyInstaller
        # 必须装进 backend 的 uv 环境 (pywebview/polars 等依赖都在那里),
        # 否则根目录 uv run 找不到依赖, 打包出来的产物启动即崩。
        # 注意: 不用 `uv pip install --project backend` —— 在 macos runner 上
        # --project 的 venv 自动发现不可靠 (报 "No virtual environment found")。
        # 用 working-directory 进 backend 目录, 与上面 uv sync 的环境一致。
        working-directory: backend
        run: uv pip install pyinstaller

      - name: 打包 (PyInstaller)
        # 在 backend 目录跑 (用该目录的 venv: pywebview/polars 等依赖)。
        # 产物输出到 backend/dist/ (PyInstaller 默认路径), 与 packaging/hquant.iss
        # 的 Source 路径 (..\backend\dist\HQuant\*) 保持一致。
        # SPECPATH 由 spec 文件位置决定 (packaging/hquant.spec → 项目根),
        # 与 cwd 无关, 故 frontend_v2/dist 等相对路径仍正确。
        working-directory: backend
        run: uv run pyinstaller ../packaging/hquant.spec --noconfirm

      - name: 生成升级保护清单
        # 二次开发升级对比基线: 对打包产出的 _internal 全量文件做 sha256。
        # 相对路径与运行时 _MEIPASS 布局一致, 清单落 _internal/app/ 后随
        # Inno/DMG/tar 一起分发, 运行时由 upgrade_guard 读取。
        # uv run --no-project: 跨平台用 uv 管的 Python; 版本号唯一权威 =
        # frontend_v2/package.json (与 app/__init__._load_version 同源)。
        # shell: bash —— Windows runner 默认是 pwsh, 不认识 FOO=$(...) 语法;
        # 三平台 runner 均自带 bash, 显式指定即可统一。
        shell: bash
        run: |
          APP_VER=$(node -p "require('./frontend_v2/package.json').version")
          uv run --no-project python scripts/generate_manifest.py --root backend/dist/HQuant/_internal --output backend/dist/HQuant/_internal/app/upgrade_manifest.json --version "$APP_VER"

      - name: 检查 Polars 兼容内核 (仅 Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $runtimeRoot = 'backend/dist/HQuant/_internal'
          $required = @(
            '_polars_runtime_32/_polars_runtime.pyd',
            '_polars_runtime_compat/_polars_runtime.pyd'
          )
          $missing = $required | Where-Object {
            -not (Test-Path (Join-Path $runtimeRoot $_))
          }
          if ($missing) {
            throw "PyInstaller output is missing Polars runtime(s): $($missing -join ', ')"
          }

      - name: 安装 Inno Setup (仅 Windows)
        if: matrix.platform == 'windows'
        # Inno Setup 6: 把 PyInstaller 产出封装成单文件安装包
        run: choco install innosetup -y --no-progress

      - name: 生成 Windows 安装包 (Inno Setup)
        if: matrix.platform == 'windows'
        # 从 frontend_v2/package.json 读版本号传给 ISCC, 保持与 Release tag 一致
        run: |
          $ver = (Get-Content frontend_v2/package.json | ConvertFrom-Json).version
          echo "版本号: $ver"
          ISCC.exe "/DMyAppVersion=$ver" packaging/hquant.iss
          # 把生成的 Setup.exe 移到工作区根 (Release 上传用)
          Move-Item packaging/Output/HQuant-Setup-$ver.exe ${{ matrix.artifact }} -Force
        shell: pwsh

      - name: 生成 DMG (macOS)
        if: matrix.platform == 'macos'
        # 用 create-dmg 生成标准 macOS DMG:
        # 挂载后显示一个带背景的卷, 左侧 app 图标, 右侧 Applications 替身,
        # 用户直接把图标拖进 Applications 即完成安装 (符合 mac 习惯)。
        # --app-drop-link 在指定坐标生成 Applications 替身 (即"拖拽安装"箭头的目标);
        # --skip-jenkins 跳过 Finder 排图标动画 (CI 无 GUI, 否则 AppleScript 卡住)。
        # 工作目录是项目根 (与 Windows/Linux 步骤一致), 产物输出到根。
        # create-dmg 语法: create-dmg [选项] <输出.dmg> <源目录或.app>
        run: |
          brew install create-dmg
          create-dmg \
            --volname "H-Quant" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "HQuant.app" 175 190 \
            --app-drop-link 425 190 \
            --hide-extension "HQuant.app" \
            --skip-jenkins \
            --no-internet-enable \
            "${{ matrix.artifact }}" \
            backend/dist/HQuant.app

      - name: 压缩产物 (Linux)
        if: matrix.platform == 'linux'
        run: |
          cd backend/dist
          tar -czf ../../${{ matrix.artifact }} HQuant

      - name: 上传产物为构建产物 (备查)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: 上传到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          files: ${{ matrix.artifact }}
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true   # 自动从 commit 生成 changelog
          body: |
            ## 桌面客户端 ${{ github.event.inputs.version }}

            ### ⬇️ 下载

            | 平台 | 文件 | 下载 |
            | :--- | :--- | :--- |
            | **Windows x64** | `HQuant-Setup-x64-${{ needs.prepare.outputs.ver }}.exe` | [⬇️ 立即下载](https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.version }}/HQuant-Setup-x64-${{ needs.prepare.outputs.ver }}.exe) |
            | **macOS (Apple Silicon / M 系列芯片)** | `HQuant-macos-arm64-${{ needs.prepare.outputs.ver }}.dmg` | [⬇️ 立即下载](https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.version }}/HQuant-macos-arm64-${{ needs.prepare.outputs.ver }}.dmg) |
            | **Linux** | `HQuant-linux-x64-${{ needs.prepare.outputs.ver }}.tar.gz` | [⬇️ 立即下载](https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.version }}/HQuant-linux-x64-${{ needs.prepare.outputs.ver }}.tar.gz) |

            > 💡 点击「立即下载」直接获取, 无需滚动到底部附件区。
            > 🍎 **macOS 仅提供 Apple Silicon (M 系列芯片) 版本**: 点左上角  → "关于本机", 看"芯片"一项是否为 Apple; Intel 芯片 Mac 暂不支持 (上游 polars 已停止发布 Intel wheel)。

            ### 📋 使用说明
            - **Windows**: 下载后双击运行, 按安装向导操作(无需管理员权限), 自动创建桌面/开始菜单快捷方式
            - **macOS**: 双击 dmg 打开, 将 H-Quant 拖入 Applications 文件夹; 首次启动需右键→打开(绕过 Gatekeeper)
            - **Linux**: 解压后运行可执行文件
            - 数据存储: Windows 在安装目录的 `data/` 子文件夹 (卸载重装不丢); macOS 在 `~/Library/Application Support/H-Quant` (替换 App 升级不丢)
            - 内置 Polars 兼容内核, 新老 CPU (无 AVX2) 均可运行
            - 含纯 Polars 回测引擎; 不含 vectorbt 回测(为控制体积)
            - 系统通知: 设置 → 实时监控 → 系统通知
            - 检查更新: 设置 → 系统设置 → 关于

  # 第三步: 生成 latest.json 更新清单 (客户端「检查更新」的稳定契约)
  manifest:
    needs: build
    # fail-fast: false 时部分平台失败会让 build 整体标红, 但已成功的平台资产
    # 依然有效 — 清单照样生成 (以 Release 上实际存在的资产为准, 天然支持
    # "今天发 Windows, 明天补 mac" 的分批发布: 每次按当前 Release 全量重建)。
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: 生成并上传 latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.version }}
          UPDATE_BASE_URL: ${{ vars.HQUANT_UPDATE_BASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p assets && cd assets
          # 只拉已知的三个安装包 (latest.json 自身等其他资产不进清单);
          # 产物文件名带版本号, 故用通配匹配当前版本
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'HQuant-Setup-x64-*.exe' \
            --pattern 'HQuant-macos-arm64-*.dmg' \
            --pattern 'HQuant-linux-x64-*.tar.gz' \
            --clobber || true
          cd ..
          RELEASE_JSON=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          # 更新日志写进 latest.json: 客户端在应用内直接显示, 不跳 GitHub
          # (国内访问不了, notes_url 只作兜底)。取上一个 Release 到本 tag 的
          # commit 标题; 首个版本没有上一个发布 → 空数组。
          PREV_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=20" \
            --jq "[.[] | select(.tag_name != \"$TAG\")][0].tag_name // empty")
          if [ -n "$PREV_TAG" ]; then
            NOTES_JSON=$(gh api "repos/$GITHUB_REPOSITORY/compare/$PREV_TAG...$TAG" --jq \
              '[.commits[] | .commit.message | split("\n")[0]] | .[-30:]')
          else
            NOTES_JSON='[]'
          fi
          export NOTES_JSON
          TAG="$TAG" REPO="$GITHUB_REPOSITORY" RELEASE_JSON="$RELEASE_JSON" python3 - <<'EOF'
          import hashlib, json, os, sys
          from pathlib import Path

          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          rel = json.loads(os.environ["RELEASE_JSON"])

          # version 去掉 v 前缀, 与 package.json 语义版本一致
          # (产物文件名 HQuant-Setup-x64-0.3.3.exe 用的就是不带 v 的版本)
          version = tag[1:] if tag.startswith("v") else tag

          # 资产文件名 → 渠道名 (客户端按渠道取下载地址); 文件名带版本号, 按当前 tag 拼
          channels_cfg = {
              f"HQuant-Setup-x64-{version}.exe": "windows",
              f"HQuant-macos-arm64-{version}.dmg": "macos-arm64",
              f"HQuant-linux-x64-{version}.tar.gz": "linux-x64",
          }
          by_name = {a["name"]: a for a in rel.get("assets", [])}

          channels = {}
          for name, channel in channels_cfg.items():
              local = Path("assets") / name
              if not local.exists():
                  continue  # 本次未构建该平台 (分批发布), 清单只列实际存在的
              sha = hashlib.sha256(local.read_bytes()).hexdigest()
              channels[channel] = {
                  "name": name,
                  "url": by_name[name]["browser_download_url"],
                  "size": by_name[name]["size"],
                  "sha256": sha,
              }

          if not channels:
              print("::warning::Release 上没有任何安装包资产, 跳过 latest.json 生成")
              sys.exit(0)

          # 下载地址指向 R2 公开基址 (与 latest.json 同桶同域名)。
          # 不写 GitHub 的 browser_download_url: 国内下 130MB 走 GitHub 很慢,
          # 且 R2 是我们自己的对外通道 —— 客户端只认这一个域名。
          # 环境变量缺失时退回 GitHub 资产地址, 保证清单照样可用。
          base = os.environ.get("UPDATE_BASE_URL", "").rstrip("/")
          if base:
              for ch in channels.values():
                  ch["url"] = f"{base}/{ch['name']}"

          # 更新内容直接内嵌, 客户端在应用内显示 —— 不引导用户去 GitHub
          # (国内访问不了)。notes 是 commit 标题列表, notes_url 仅作兜底跳转。
          notes = json.loads(os.environ.get("NOTES_JSON") or "[]")

          manifest = {
              "version": version,
              "tag": tag,
              "released_at": rel.get("published_at") or rel.get("created_at"),
              "prerelease": bool(rel.get("prerelease")),
              "notes": notes,
              "notes_url": f"https://github.com/{repo}/releases/tag/{tag}",
              "channels": channels,
          }
          Path("latest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          EOF
          # --clobber: 同名资产覆盖 (重跑同一版本时更新清单而不是追加 _01 副本)
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: 发布更新清单到 Cloudflare R2
        # 客户端「检查更新」只读 R2 上的固定 URL, 不碰 GitHub API:
        #   - 仓库在 Gitee, GitHub 只是构建机; 客户端不能匿名读私有仓库的 Release
        #   - GitHub 未认证 API 60 次/时, 国内网络也不稳
        # R2 公开桶 (或自定义域) 上的 latest.json 是唯一对外更新契约。
        # 未配置时 skip (不发版只构建的场景不应因缺配置而失败)。
        # 注意: 条件必须直接读 vars/secrets, 不能读步骤自己的 env —— 步骤级 env
        # 在 if 求值时尚未生效, 写成 env.X != '' 会恒为 false, 这一步将永远跳过。
        if: ${{ vars.HQUANT_UPDATE_BASE_URL != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          # R2 不区分 region, 但 AWS CLI 没有 region 就不发请求
          # (报 "You must specify a region") —— 显式给一个占位值。
          AWS_DEFAULT_REGION: us-east-1
          R2_BUCKET: ${{ vars.HQUANT_R2_BUCKET }}
          UPDATE_BASE_URL: ${{ vars.HQUANT_UPDATE_BASE_URL }}
        run: |
          set -euo pipefail
          # 清单刚由上一步上传到 Release, 这里取本地生成的那份 (同 job 同工作区)
          test -f latest.json || { echo "::error::latest.json 未生成"; exit 1; }

          # 凭据缺一不可 —— 缺了就点名, 别让 AWS 抛 "Invalid bucket name" 正则错误
          # (那次失败: 桶名变量没配, 拼出 s3:///latest.json, 报错完全指不到配置项)
          # 注意 secret 名与注入的 env 名不同 (R2_ACCESS_KEY_ID → AWS_ACCESS_KEY_ID),
          # 按 env 名取值、按 secret 名报错。
          missing=()
          for pair in "R2_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID" \
                      "R2_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY" \
                      "R2_ENDPOINT_URL=AWS_ENDPOINT_URL"; do
            secret_name="${pair%%=*}"; env_name="${pair#*=}"
            [ -n "${!env_name:-}" ] || missing+=("secret $secret_name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::R2 凭据缺失: ${missing[*]} —— 在仓库 Settings → Secrets and variables → Actions 里补齐后重跑。"
            exit 1
          fi

          # endpoint 归一 —— R2 的 S3 端点有两种写法:
          #   账户级 https://<ACCOUNT>.r2.cloudflarestorage.com
          #   桶级   https://<ACCOUNT>.r2.cloudflarestorage.com/<BUCKET>
          # 桶级写法的路径里就带着桶名 (省掉一次手工配置); 上传一律用账户级
          # 端点 + path-style, 请求 URL 固定为 R2 文档里的
          # https://<ACCOUNT>.r2.cloudflarestorage.com/<BUCKET>/<KEY>。
          EP="${AWS_ENDPOINT_URL%/}"
          case "$EP" in
            http://*|https://*) ;;
            *) echo "::error::R2 endpoint 非法: '$AWS_ENDPOINT_URL' (应以 http:// 或 https:// 开头)"; exit 1 ;;
          esac
          EP_HOST="${EP%%://*}"          # https
          EP_REST="${EP#*://}"           # <ACCOUNT>.r2.cloudflarestorage.com[/<BUCKET>]
          EP_HOST="$EP_HOST://${EP_REST%%/*}"
          EP_BUCKET=""
          if [ "${EP_REST%%/*}" != "$EP_REST" ]; then
            EP_BUCKET="${EP_REST#*/}"    # 桶级写法 → 路径末段就是桶名
            EP_BUCKET="${EP_BUCKET##*/}"
          fi

          # 桶名来源 (只有这两条, 因为第三条不存在):
          #   1. 仓库变量 HQUANT_R2_BUCKET (显式配置, 永远最准)
          #   2. 桶级 endpoint 写法 (https://<ACCOUNT>.r2.cloudflarestorage.com/<BUCKET>)
          #   3. ListBuckets 兜底 —— 但 R2 的 API token 默认只授权单个桶
          #      (Object Read & Write), 没有 ListBuckets 权限, 所以这条基本必失败,
          #      只作为「万一 token 是 Admin 权限」的侥幸路径。
          #
          # 曾经试过从更新基址反推, 是错的: R2 的公开开发域名
          # https://pub-<HASH>.r2.dev 里 <HASH> 是随机串, 与桶名无关
          # (实测去掉 pub- 后 NoSuchBucket)。别再往回加。
          if [ -z "${R2_BUCKET:-}" ] && [ -n "$EP_BUCKET" ]; then
            R2_BUCKET="$EP_BUCKET"
            echo "::notice::从 R2 endpoint 路径取到桶名: $R2_BUCKET"
          fi
          UB="${UPDATE_BASE_URL%/}"
          if [ -z "${R2_BUCKET:-}" ]; then
            ls_err="$(mktemp)"
            buckets=$(aws s3 ls --endpoint-url "$EP_HOST" \
                        --query 'Buckets[].Name' --output text 2>"$ls_err" || true)
            names=$(printf '%s\n' "$buckets" | tr '\t' '\n' | sed '/^$/d')
            count=$(printf '%s\n' "$names" | grep -c . || true)
            if [ "$count" = "1" ]; then
              R2_BUCKET=$(printf '%s\n' "$names" | head -n1)
              echo "::notice::自动发现桶名: $R2_BUCKET"
            elif [ "$count" -gt 1 ]; then
              echo "::error::凭据可见多个桶 (${count} 个): $(printf '%s\n' "$names" | paste -sd, -)。请在 R2 控制台确认要发版的桶, 填入该仓库变量 HQUANT_R2_BUCKET。"
              exit 1
            else
              echo "::error::定不出桶名, 且 ListBuckets 列不出任何桶。"
              echo "::error::aws s3 ls 的真实报错: $(tr '\n' ' ' < "$ls_err")"
              echo "::error::两种修法: ① 在 R2 控制台的桶列表里抄下桶名, 填入本仓库变量 HQUANT_R2_BUCKET; ② 把 secret R2_ENDPOINT_URL 改成桶级写法 (https://<ACCOUNT>.r2.cloudflarestorage.com/<BUCKET>), 桶名从路径里自动取。"
              exit 1
            fi
          fi
          # 桶名先按 S3 规则自检, 别把非法值交给 AWS 去报正则
          case "$R2_BUCKET" in
            ""|*[!a-z0-9.-]*)
              echo "::error::桶名非法: '$R2_BUCKET' (只允许小写字母、数字、连字符与点)"
              exit 1 ;;
          esac

          # path-style: AWS CLI 默认按桶名拼 virtual-host 域名, 这里显式钉死
          # path-style, 请求 URL 才是 <账户级端点>/<桶名>/<KEY>。
          AWS_CONFIG_FILE="$(mktemp)"
          export AWS_CONFIG_FILE
          printf '[default]\ns3 =\n  addressing_style = path\n' > "$AWS_CONFIG_FILE"

          # 安装包也进 R2 —— 清单里的下载地址指向这里。国内直连 GitHub 下 130MB
          # 又慢又容易断, R2 是我们自己的对外通道, 客户端只认这一个域名。
          # 先传安装包再传清单: 顺序反了会出现「清单已更新、安装包还没到」的空窗,
          # 客户端点下载就 404。
          shopt -s nullglob
          for f in assets/HQuant-Setup-x64-*.exe assets/HQuant-macos-arm64-*.dmg \
                   assets/HQuant-linux-x64-*.tar.gz; do
            echo "上传 $(basename "$f") → s3://$R2_BUCKET/$(basename "$f")"
            aws s3 cp "$f" "s3://$R2_BUCKET/$(basename "$f")" \
              --endpoint-url "$EP_HOST" \
              --content-type "application/octet-stream" \
              --cache-control "public, max-age=31536000, immutable"
          done
          shopt -u nullglob

          aws s3 cp latest.json "s3://$R2_BUCKET/latest.json" \
            --endpoint-url "$EP_HOST" \
            --content-type "application/json" \
            --cache-control "public, max-age=300"

          # 公网自检 —— 客户端就是从这个地址读清单, 浏览器直连必须带 CORS 头,
          # 否则 fetch 被浏览器拦掉, "检查更新"永远失败 (R2 的 token 只有对象
          # 读写权限, 改不了桶的 CORS 策略, 只能在这里验 + 报错指路)。
          hdr="$(mktemp)"
          if ! curl -fsS -D "$hdr" -o /dev/null \
               -H "Origin: http://127.0.0.1:3018" "$UB/latest.json"; then
            echo "::error::上传成功, 但公网地址读不到清单: $UB/latest.json —— 检查桶是否公开、r2.dev 域名是否已启用。"
            exit 1
          fi
          if ! grep -qi '^access-control-allow-origin:' "$hdr"; then
            echo "::error::清单已上传, 但 R2 桶没开 CORS —— 浏览器直连会被拦, 客户端「检查更新」拿不到版本。"
            echo "::error::在 R2 控制台 → ${R2_BUCKET} → 设置 → CORS 策略, 粘贴: [{\"AllowedOrigins\":[\"*\"],\"AllowedMethods\":[\"GET\",\"HEAD\"],\"AllowedHeaders\":[\"*\"],\"MaxAgeSeconds\":3600}]"
            exit 1
          fi
          # 清单里的下载地址必须指向 R2 且真的存在 —— 上一版只把 latest.json
          # 传了上去, 安装包留在 GitHub, 客户端点下载走的是境外地址。
          grep -q "$UB/" latest.json || {
            echo "::error::latest.json 里的下载地址没指向更新基址 $UB —— 检查生成清单那一步的 UPDATE_BASE_URL。"
            exit 1
          }
          for url in $(python3 -c "
          import json
          m = json.load(open('latest.json'))
          print('\n'.join(c['url'] for c in m.get('channels', {}).values()))
          "); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -I --max-time 60 "$url" || echo 000)
            case "$code" in
              200|206) echo "安装包可下载: $url" ;;
              *) echo "::error::清单里的安装包地址不可用 (http $code): $url"
                 exit 1 ;;
            esac
          done
          echo "::notice::更新清单已发布: $UB/latest.json"
